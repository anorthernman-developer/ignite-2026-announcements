name: Build data files

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "taxonomy/taxonomy.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/taxonomy_gen.py && python scripts/build.py
      - name: Commit generated files
        run: |
          git config user.name "ignite-tracker-bot"
          git config user.email "ignite-tracker-bot@users.noreply.github.com"
          git add data/ LLM.TXT taxonomy/
          git diff --cached --quiet || git commit -m "Rebuild spreadsheet, CSV, JSON and LLM.TXT from scripts/data.py"
          git push
